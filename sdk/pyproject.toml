[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dodaios-sdk"
version = "0.1.0"
description = "The plugin contracts of Dodaios: what a speech, brain, tool, channel or realtime plugin implements. Standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["dodaios_sdk"]

[tool.setuptools.package-data]
dodaios_sdk = ["py.typed"]
