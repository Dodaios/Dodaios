; Project changes to the engine's scalability levels (Engine/Config/BaseScalability.ini).
; The Competitive preset (dodaios/verse_host/game_settings.py) uses the "high" groups at a 60 %
; resolution scale. At high, local lights draw their virtual shadow maps at half resolution:
; in the hangar halls that took ~0.3 ms of GPU time per frame at 1440p and the soft spot-light
; shadows look the same. Epic and Cinematic keep the engine's values.
[ShadowQuality@2]
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
