; CPU budget at start: the PSO precompile pool takes 75 % of the hardware threads by default,
; which pins every core while a fresh build warms its pipeline cache. A quarter keeps the
; machine responsive; the precache still finishes in the background.
[SystemSettings]
r.pso.PrecompileThreadPoolPercentOfHardwareThreads=25
