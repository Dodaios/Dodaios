[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Verse
CopyrightNotice=

[/Script/UnrealEd.ProjectPackagingSettings]
; Chunks: one IoStore chunk per deck level, sorted by the DA_DeckChunk_<Deck> labels (WP22.3).
bGenerateChunks=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
+MapsToCook=(FilePath="/Game/Verse/Decks/Bridge/LV_Bridge")
+MapsToCook=(FilePath="/Game/Verse/Decks/Ops/LV_Ops")
+MapsToCook=(FilePath="/Game/Verse/Decks/Engineering/LV_Engineering")
+MapsToCook=(FilePath="/Game/Verse/Decks/Hangar/LV_Hangar")
; Assets resolved by path at runtime, with no map referencing them (art-pipeline 9).
; The game loads data assets, weapons, VFX, audio cues and placeholder art by soft path, so
; the whole /Game/Verse tree is cooked (package.py verify guards these lines).
+DirectoriesToAlwaysCook=(Path="/Game/Verse")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineFonts")
; Text data the game reads from FPaths::ProjectDir() at runtime (Data/ui, rules, crew, melee,
; weapons, bot, arena) and the deck placement files. Paths are relative to Content/; staged
; loose next to the pak as <Stage>/Verse/Data and <Stage>/Verse/Art/Placements.
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Data")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Art/Placements")
