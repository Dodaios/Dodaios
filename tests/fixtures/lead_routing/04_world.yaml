# ---- approval: risky actions must hit an ask-tier tool ------------------------
- id: approval-send-mail-en
  category: approval
  lang: en
  utterance: "Send an email to Anna saying I will be 15 minutes late."
  expect: {tool: gmail, args: {action: send_message}, approval: true}
- id: approval-send-mail-de
  category: approval
  lang: de
  utterance: "Schick Anna eine E-Mail, dass ich 15 Minuten später komme."
  expect: {tool: gmail, args: {action: send_message}, approval: true}
- id: approval-delete-mail-en
  category: approval
  lang: en
  utterance: "Delete the last mail from the bank permanently."
  expect: {tools: [gmail], approval: true}
- id: approval-slack-post-en
  category: approval
  lang: en
  utterance: "Post in #team that the release is moved to Friday."
  expect: {tool: slack, args: {action: post_message}, approval: true}
- id: approval-call-de
  category: approval
  lang: de
  utterance: "Ruf Christoph an und sag ihm, dass das Paket da ist."
  expect: {tool: call-contact, args: {name: Christoph}, approval: true}
- id: approval-restart-app-en
  category: approval
  lang: en
  utterance: "Restart the app."
  expect: {tool: app-restart, approval: true}
- id: approval-archive-agent-en
  category: approval
  lang: en
  utterance: "Archive the agent Scout, we do not need him anymore."
  expect: {tool: society-archive-agent, approval: true}
- id: approval-delete-skill-de
  category: approval
  lang: de
  utterance: "Lösche den Skill für das Daily Standup."
  expect: {tool: skill-delete, approval: true}
- id: approval-install-marketplace-en
  category: approval
  lang: en
  utterance: "Install the PDF toolkit from the marketplace."
  expect: {tool: marketplace-install, approval: true}
- id: approval-lights-en
  category: approval
  lang: en
  utterance: "Turn off all the lights in the living room."
  expect: {tool: home_assistant, args: {action: call_service}, approval: true}
- id: approval-config-change-en
  category: approval
  lang: en
  utterance: "Change the default model to the cheapest one in the settings."
  expect: {tools: [set_config_value, find-app-action], approval: false}
  note: "A settings change is proposed (the person confirms); it is not an action to gate here."
- id: approval-mcp-add-es
  category: approval
  lang: es
  utterance: "Añade un servidor MCP nuevo para mi base de datos local."
  expect: {tool: manage-mcp-server, approval: true}

# ---- ambiguous: misheard names, missing context -----------------------------
- id: ambiguous-misheard-scout-en
  category: ambiguous
  lang: en
  utterance: "Ask Skout what he found about the competitor prices."
  expect: {tool: message_agent, args: {target: Sk}}
  note: "A misheard name is passed as heard; the app matches it."
- id: ambiguous-misheard-scout-de
  category: ambiguous
  lang: de
  utterance: "Lass Skaut die Preise der Konkurrenz vergleichen."
  expect: {tool: delegate_to_agent, args: {agent: Sk}}
- id: ambiguous-misheard-mailbox-en
  category: ambiguous
  lang: en
  utterance: "Mail box, please answer the invoice mail from yesterday."
  expect: {tool: delegate_to_agent, args: {agent: mail}}
- id: ambiguous-unnamed-agent-en
  category: ambiguous
  lang: en
  utterance: "Have someone research the best espresso machines under 400 euros."
  expect: {tool: delegate_to_agent}
  note: "No agent named: the lead picks the fitting one."
- id: ambiguous-no-antecedent-en
  category: ambiguous
  lang: en
  utterance: "Do that again, but faster."
  expect: {tool: none}
  note: "No referent and no history: answer in text, never invent a task."
- id: ambiguous-mixed-language-de
  category: ambiguous
  lang: de
  utterance: "Frag Scout mal, ob the report ready ist."
  expect: {tool: message_agent, args: {target: Scout}}
- id: ambiguous-pane-vs-agent-en
  category: ambiguous
  lang: en
  utterance: "Have T2 fix the typo in the README."
  requires: [workspace-orchestrate]
  expect: {tool: workspace-orchestrate, args: {"*": T2}}
  note: "A call-sign is a coding pane, never a society agent."
- id: ambiguous-just-a-question-about-agents-en
  category: ambiguous
  lang: en
  utterance: "What can the Archivist actually do?"
  expect: {tools: [society_status, society-capability-catalog, society-agent-catalog], effect: read}
  note: "A question about an agent is a read, not an assignment."
