# Golden routing cases: web and browser, computer use, answering directly,
# risky actions that must hit approval, ambiguous or misheard requests.

# ---- web_browser -------------------------------------------------------------
- id: web-news-en
  category: web_browser
  lang: en
  utterance: "What are the latest headlines about the EU AI act today?"
  expect: {tool: search_web, effect: read}
- id: web-news-de
  category: web_browser
  lang: de
  utterance: "Was sind heute die neuesten Nachrichten zum EU-KI-Gesetz?"
  expect: {tool: search_web, effect: read}
- id: web-weather-en
  category: web_browser
  lang: en
  utterance: "What is the weather in Berlin this weekend?"
  expect: {tool: search_web, effect: read}
- id: web-price-de
  category: web_browser
  lang: de
  utterance: "Wie steht der Bitcoin-Kurs gerade?"
  expect: {tool: search_web, effect: read}
- id: web-look-it-up-es
  category: web_browser
  lang: es
  utterance: "Búscalo en internet: horarios del tren de Madrid a Valencia para mañana."
  expect: {tool: search_web, effect: read}
- id: web-look-it-up-pt
  category: web_browser
  lang: pt
  utterance: "Pesquisa na internet o resultado do jogo de ontem do Benfica."
  expect: {tool: search_web, effect: read}
- id: browser-read-pricing-en
  category: web_browser
  lang: en
  utterance: "Open the pricing page of acme-example.com in the browser and tell me the cheapest plan."
  expect: {tool: society_browser, effect: read}
- id: browser-read-pricing-de
  category: web_browser
  lang: de
  utterance: "Geh im Browser auf die Preisseite von acme-example.com und sag mir den günstigsten Tarif."
  expect: {tool: society_browser, effect: read}

# ---- computer_use ------------------------------------------------------------
- id: cu-notepad-en
  category: computer_use
  lang: en
  utterance: "Open Notepad and type: buy milk."
  expect: {tool: computer_use}
- id: cu-notepad-de
  category: computer_use
  lang: de
  utterance: "Öffne Notepad und schreib hinein: Milch kaufen."
  expect: {tool: computer_use}
- id: cu-click-button-en
  category: computer_use
  lang: en
  utterance: "Click the blue Save button on my screen."
  expect: {tool: computer_use}
- id: cu-chrome-gmail-de
  category: computer_use
  lang: de
  utterance: "Öffne Chrome und geh auf die Seite von meinem Bankkonto."
  expect: {tool: computer_use}
- id: cu-screenshot-en
  category: computer_use
  lang: en
  utterance: "Take a screenshot and tell me what is on my screen."
  expect: {tool: screenshot, effect: read}
- id: cu-music-en
  category: computer_use
  lang: en
  utterance: "Play some Radiohead."
  expect: {tools: [youtube_music, spotify], args: {action: play}}
- id: cu-music-pause-de
  category: computer_use
  lang: de
  utterance: "Pausier die Musik."
  expect: {tools: [youtube_music, spotify], args: {action: pause}}
- id: cu-shell-status-en
  category: computer_use
  lang: en
  utterance: "Run git status in my projects folder and tell me what is changed."
  expect: {tools: [run_shell, RunCommand]}

