# Golden routing cases: memory, settings, mail and calendar, routines, costs and navigation.

# ---- memory ------------------------------------------------------------------
- id: memory-search-birthday-en
  category: memory
  lang: en
  utterance: "What do you remember about my sister's birthday?"
  expect: {tool: memory-search, effect: read}
- id: memory-search-birthday-de
  category: memory
  lang: de
  utterance: "Was weißt du noch über den Geburtstag meiner Schwester?"
  expect: {tool: memory-search, effect: read}
- id: memory-search-history-en
  category: memory
  lang: en
  utterance: "Where did I live before Hamburg? Check how that changed over time."
  expect: {tool: memory-search, args: {history: true}, effect: read}
- id: memory-search-talk-de
  category: memory
  lang: de
  utterance: "Worüber haben wir gestern beim Budget gesprochen?"
  expect: {tool: memory-search, effect: read}
- id: memory-search-es
  category: memory
  lang: es
  utterance: "¿Qué te dije sobre mi viaje a Sevilla?"
  expect: {tool: memory-search, effect: read}
- id: memory-forget-city-en
  category: memory
  lang: en
  utterance: "Forget that I live in Hamburg."
  expect: {tool: memory-forget, args: {about: Hamburg}}
- id: memory-forget-city-de
  category: memory
  lang: de
  utterance: "Vergiss, dass ich in Hamburg wohne."
  expect: {tool: memory-forget, args: {about: Hamburg}}
- id: memory-profile-preference-en
  category: memory
  lang: en
  utterance: "From now on keep your answers short, I hate long explanations."
  expect: {tool: update_profile}
- id: memory-profile-name-de
  category: memory
  lang: de
  utterance: "Nenn mich ab jetzt Rufus, nicht Ruben."
  expect: {tool: update_profile}
- id: memory-contact-upsert-en
  category: memory
  lang: en
  utterance: "Save Anna Weber's phone number: 0151 2345678."
  expect: {tool: contact-upsert, args: {name: Anna}}
- id: memory-contact-lookup-de
  category: memory
  lang: de
  utterance: "Wie ist die Telefonnummer von Anna Weber?"
  expect: {tool: contact-lookup, args: {name: Anna}, effect: read}

- id: doctrine-memory-before-asking-en
  category: memory
  lang: en
  utterance: "Book me a flight to Lisbon with the airline I usually fly with."
  expect: {tools: [memory-search], also_accept: [gmail]}

# ---- settings ----------------------------------------------------------------
- id: settings-dark-mode-en
  category: settings
  lang: en
  utterance: "Switch the app to dark mode."
  expect: {tool: set_config_value, args: {path: theme}}
- id: settings-speech-speed-de
  category: settings
  lang: de
  utterance: "Sprich bitte etwas langsamer."
  expect: {tool: set_config_value, args: {path: tts}}
- id: settings-list-en
  category: settings
  lang: en
  utterance: "Which settings can you change for me?"
  expect: {tool: list_mutable_settings, also_accept: [describe-app-settings], effect: read}
- id: settings-current-value-en
  category: settings
  lang: en
  utterance: "What is my current text-to-speech speed?"
  expect: {tool: get_config_value, also_accept: [describe-app-settings], effect: read}
- id: settings-volume-de
  category: settings
  lang: de
  utterance: "Stell die Lautstärke deiner Stimme auf 30 Prozent."
  expect: {tool: tts-volume-set}
- id: settings-wake-word-en
  category: settings
  lang: en
  utterance: "Change the wake word to Hey Atlas."
  expect: {tool: wake-word-set, args: {phrase: Atlas}}
- id: settings-reply-language-es
  category: settings
  lang: es
  utterance: "A partir de ahora respóndeme siempre en español."
  expect: {tool: reply-language-set, args: {language: es}}
- id: settings-reply-language-de
  category: settings
  lang: de
  utterance: "Antworte mir ab jetzt immer auf Deutsch."
  expect: {tool: reply-language-set, args: {language: de}}
- id: settings-find-action-pt
  category: settings
  lang: pt
  utterance: "Desativa as notificações do ecrã inicial."
  expect: {tools: [find-app-action, set_config_value]}
- id: settings-providers-list-en
  category: settings
  lang: en
  utterance: "Which model providers do I have connected?"
  expect: {tool: providers-list, also_accept: [describe-app-settings], effect: read}

