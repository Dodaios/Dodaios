# Unreal Verse packaging lane (docs/verse/unreal/architecture.md 8.3,
# docs/verse/unreal/work-packages.md WP22).
#
#   package        self-hosted (the dev box): BuildCookRun Win64 and Linux
#                  Shipping with IoStore chunks per deck, the harness check
#                  and the size report. Builds go through
#                  scripts/unreal/package.py, which takes the machine lock.
#                  This job holds no secret and never signs: the runner is a
#                  person's own machine (RK12).
#   sign-windows   GitHub-hosted: hands the unsigned Verse binaries to the
#                  existing SignPath signing path (docs/code-signing-policy.md)
#                  and verifies the Authenticode signature before the signed
#                  files replace the unsigned ones.
#   assemble       GitHub-hosted: full package tar per platform, the delta
#                  from the previous release and the per-platform release
#                  manifest (package.py full / delta / manifest).
#   sign-manifest  GitHub-hosted, release-signing environment: the release
#                  key's Ed25519 signature over each verse-<Platform>-manifest.json
#                  (version, sizes, SHA-256 of every package), the same key
#                  the in-app updater pins, plus verse-SHA256SUMS.txt for
#                  checking by hand.
#   release        attaches the Verse assets to the tag's release, never
#                  replacing an existing asset.
#
# The Verse is an optional download (docs/verse/unreal/README.md, Delivery):
# these assets sit on the release beside the installers but no installer,
# app update or source archive carries them. The app fetches them only when
# the user presses "Download the Verse" (dodaios/verse_host/install).
#   linux-smoke    nightly, self-hosted: Linux Development package and the
#                  60 s container smoke (package.py linux-smoke).
#
# Self-hosted jobs never run for pull requests: this workflow has no
# pull_request trigger at all (architecture.md 8.2).
#
# Each platform ships on its own: a failed Linux leg (or a failed Windows
# signature) does not stop the other platform's payload. The jobs after
# package run unless the run was cancelled, and a leg whose artifact is
# missing fails on its own download step.

name: unreal-package

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    # Nightly Linux smoke (A22.6); the quiet-hours rule of architecture.md 8.2.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      previous:
        description: "Release tag the delta starts from (empty: the latest release)"
        required: false
        default: ""
      smoke_only:
        description: "Only run the Linux smoke"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: unreal-build
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  package:
    if: github.event_name != 'schedule' && !inputs.smoke_only
    name: Package ${{ matrix.platform }} Shipping
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      # One build at a time on the box; the machine lock queues them anyway.
      max-parallel: 1
      fail-fast: false
      matrix:
        platform: [win64, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          lfs: false

      # .lfsconfig keeps installs from fetching unreal/**; the runner needs it.
      - name: Fetch the Unreal LFS objects
        shell: pwsh
        run: |
          git config lfs.fetchexclude ""
          git lfs pull

      - name: Check the toolchain
        run: python scripts/unreal/package.py verify --target ${{ matrix.platform }}

      - name: BuildCookRun
        run: python scripts/unreal/package.py build --platform ${{ matrix.platform }} --config Shipping

      - name: Upload the unsigned payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verse-unsigned-${{ matrix.platform }}
          path: unreal/Verse/Saved/Package/Shipping/${{ matrix.platform == 'win64' && 'Windows' || 'Linux' }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload the size report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verse-size-${{ matrix.platform }}
          path: unreal/Verse/Saved/Harness/proof/WP22/
          if-no-files-found: warn
          retention-days: 30

  sign-windows:
    needs: package
    if: ${{ !cancelled() && github.event_name != 'schedule' && !inputs.smoke_only }}
    name: Sign the Verse binaries (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # SignPath reads this job's metadata and downloads the unsigned artifact
      # with the job token.
      actions: read
    env:
      HAS_SIGNPATH_SIGNING: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    steps:
      - name: Download the unsigned payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verse-unsigned-win64
          path: payload

      - name: Collect the executables to sign
        if: env.HAS_SIGNPATH_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'verse-exe'
          Get-ChildItem -Path payload -Recurse -Include *.exe, *.dll | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path payload).Path.Length + 1)
            $dest = Join-Path $out $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $dest
          }

      - name: Stage the unsigned binaries for SignPath
        id: signpath-unsigned
        if: env.HAS_SIGNPATH_SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-unsigned-verse-win64
          path: ${{ runner.temp }}/verse-exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the binaries (SignPath Foundation)
        if: env.HAS_SIGNPATH_SIGNING == 'true'
        # pin: signpath/github-action-submit-signing-request@v3.0 - pinned by commit SHA.
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_VERSE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/verse-signed

      - name: Verify every signature, then replace the unsigned files
        if: env.HAS_SIGNPATH_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedRoot = Join-Path $env:RUNNER_TEMP 'verse-signed'
          $files = Get-ChildItem -Path $signedRoot -Recurse -Include *.exe, *.dll
          if (-not $files) { Write-Host '::error::SignPath returned no binaries'; exit 1 }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              Write-Host "::error::$($file.Name): $($signature.StatusMessage)"
              exit 1
            }
            $rel = $file.FullName.Substring($signedRoot.Length + 1)
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path payload $rel) -Force
          }
          Write-Host "Signed and verified $($files.Count) binaries."

      - name: Without signing secrets the payload ships unsigned
        if: env.HAS_SIGNPATH_SIGNING != 'true'
        run: echo "::warning::No SignPath configuration on this run; the Verse binaries stay unsigned."

      - name: Upload the payload for assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verse-ready-win64
          path: payload
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [package, sign-windows]
    if: ${{ !cancelled() && github.event_name != 'schedule' && !inputs.smoke_only }}
    name: Payload and delta ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            artifact: verse-ready-win64
          - platform: Linux
            artifact: verse-unsigned-linux
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: stage

      - name: Full payload
        id: full
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("dodaios/__init__.py").read_text()).group(1))')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          python -m pip install --quiet filelock
          python scripts/unreal/package.py full --stage stage --version "${version}" \
            --platform "${{ matrix.platform }}" --out "verse/Verse-${{ matrix.platform }}-${version}.tar"

      - name: Delta from the previous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          set -euo pipefail
          previous="${PREVIOUS:-}"
          if [ -z "${previous}" ]; then
            previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 \
              --json tagName --jq '.[].tagName' | grep -vx "${GITHUB_REF_NAME}" | head -n 1 || true)"
          fi
          old_version="${previous#v}"
          name="Verse-${{ matrix.platform }}-${old_version}.tar"
          if [ -z "${previous}" ] || ! gh release download "${previous}" --repo "$GITHUB_REPOSITORY" \
              --pattern "${name}" --dir old; then
            echo "::notice::No ${name} on ${previous:-any release}; this release ships the full payload only."
            exit 0
          fi
          python scripts/unreal/package.py delta --old "old/${name}" --stage stage \
            --version "${{ steps.full.outputs.version }}" \
            --out "verse/Verse-${{ matrix.platform }}-${old_version}-to-${{ steps.full.outputs.version }}.delta.tar"

      - name: Release manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.full.outputs.version }}"
          args=()
          for delta in verse/Verse-${{ matrix.platform }}-*-to-"${version}".delta.tar; do
            if [ -f "${delta}" ]; then args+=(--delta "${delta}"); fi
          done
          python scripts/unreal/package.py manifest \
            --full "verse/Verse-${{ matrix.platform }}-${version}.tar" "${args[@]}" \
            --tag "v${version}" --out "verse/verse-${{ matrix.platform }}-manifest.json"

      - name: Upload the Verse assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verse-assets-${{ matrix.platform }}
          path: verse/
          if-no-files-found: error
          retention-days: 7

  sign-manifest:
    needs: assemble
    # Signs whatever platforms assembled; none at all fails the digest step.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    name: Sign the Verse checksum manifest
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the Verse assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verse-assets-*
          path: verse
          merge-multiple: true

      - name: Check every manifest names this tag, write verse-SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          for manifest in verse/verse-*-manifest.json; do
            tag="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "${manifest}")"
            if [ "${tag}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::${manifest} names ${tag}, not ${GITHUB_REF_NAME}"
              exit 1
            fi
          done
          cd verse
          sha256sum Verse-*.tar verse-*-manifest.json > verse-SHA256SUMS.txt
          cat verse-SHA256SUMS.txt

      - name: Sign every manifest with the release key
        env:
          WAVE2_OFFLINE_KEY_B64: ${{ secrets.WAVE2_OFFLINE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WAVE2_OFFLINE_KEY_B64:-}" ]; then
            echo "::error::WAVE2_OFFLINE_KEY_B64 is not available to the release-signing environment; refusing to publish an unsigned Verse manifest."
            exit 1
          fi
          key="${RUNNER_TEMP}/verse-manifest.key"
          trap 'rm -f "$key" "${RUNNER_TEMP}/verse-manifest.sig.raw"' EXIT
          umask 077
          printf '%s' "${WAVE2_OFFLINE_KEY_B64}" | base64 -d > "$key"
          if ! grep -q "BEGIN PRIVATE KEY" "$key"; then
            echo "::error::WAVE2_OFFLINE_KEY_B64 does not decode to a PEM private key"
            exit 1
          fi
          for manifest in verse/verse-*-manifest.json; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "${manifest}" \
              -out "${RUNNER_TEMP}/verse-manifest.sig.raw"
            base64 -w0 "${RUNNER_TEMP}/verse-manifest.sig.raw" > "${manifest}.sig"
            echo "Signed ${manifest} (key contents not logged)."
          done

      - name: Verify every signature against the pinned public key
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography
          for manifest in verse/verse-*-manifest.json; do
            base64 -d "${manifest}.sig" > "${RUNNER_TEMP}/check.sig.raw"
            openssl pkeyutl -verify -pubin -inkey install/keys/offline-ceremony.pub -rawin \
              -in "${manifest}" -sigfile "${RUNNER_TEMP}/check.sig.raw"
            platform="$(basename "${manifest}" | sed -E 's/^verse-(.*)-manifest\.json$/\1/')"
            python -c 'import pathlib,sys; from dodaios.verse_host.install.manifest import verify_release_manifest as v; m=pathlib.Path(sys.argv[1]); v(m.read_bytes(), pathlib.Path(sys.argv[1]+".sig").read_text(), platform=sys.argv[2], tag=sys.argv[3]); print("verified", m.name)' \
              "${manifest}" "${platform}" "${GITHUB_REF_NAME}"
          done

      - name: Upload the signed manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verse-manifest
          path: |
            verse/verse-SHA256SUMS.txt
            verse/verse-*-manifest.json.sig
          if-no-files-found: error
          retention-days: 14

  release:
    needs: sign-manifest
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.sign-manifest.result == 'success' }}
    name: Attach the Verse to the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # The only job that writes, and only to attach the assets it verified.
      contents: write
    steps:
      - name: Download the Verse assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verse-assets-*
          path: verse
          merge-multiple: true

      - name: Download the signed manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verse-manifest
          path: verse

      - name: Check the digests, then upload without replacing anything
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd verse
          sha256sum -c verse-SHA256SUMS.txt
          existing="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for file in Verse-*.tar verse-*-manifest.json verse-*-manifest.json.sig verse-SHA256SUMS.txt; do
            if printf '%s\n' "${existing}" | grep -qx "${file}"; then
              echo "::error::${file} is already on the release; refusing to replace it"
              exit 1
            fi
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            Verse-*.tar verse-*-manifest.json verse-*-manifest.json.sig verse-SHA256SUMS.txt

  linux-smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.smoke_only)
    name: Linux smoke (nightly)
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          lfs: false

      - name: Fetch the Unreal LFS objects
        shell: pwsh
        run: |
          git config lfs.fetchexclude ""
          git lfs pull

      - name: Check the toolchain
        run: python scripts/unreal/package.py verify --target linux

      - name: Package Linux Development
        run: python scripts/unreal/package.py build --platform linux --config Development

      - name: 60 s container smoke
        run: python scripts/unreal/package.py linux-smoke --config Development --seconds 60

      - name: Upload the smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verse-linux-smoke
          path: unreal/Verse/Saved/Harness/proof/WP22/
          if-no-files-found: warn
          retention-days: 30
