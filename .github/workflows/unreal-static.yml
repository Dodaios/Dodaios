# unreal-static: the GitHub-hosted static lane of the Unreal Verse (architecture.md 8.3,
# work-packages.md WP10.1). LFS off, no engine, at most 5 minutes. A required check only
# through the CI gate job the integration owner wires into ci.yml (architecture.md 8.2).
name: unreal-static

on:
  pull_request:
    paths:
      - "unreal/**"
      - "art/verse/**"
      - "docs/verse/unreal/**"
      - "scripts/unreal/**"
      - "tests/unit/unreal_scripts/**"
      - ".github/workflows/unreal-*.yml"
  merge_group:
  push:
    branches: [main]
    paths:
      - "unreal/**"
      - "art/verse/**"
      - "docs/verse/unreal/**"
      - "scripts/unreal/**"
      - ".github/workflows/unreal-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: unreal-static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the checkers' dependencies
        run: python -m pip install --disable-pip-version-check -q pyyaml jsonschema filelock numpy pillow pytest
      - name: Find the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MQ_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="$(git rev-parse HEAD~1)" ;;
          esac
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD~1)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Build.cs DAG
        run: python scripts/unreal/check_build_dag.py
      - name: Forbidden names (tracked files, added lines, commit messages)
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          python scripts/unreal/check_forbidden_names.py
          python scripts/unreal/check_forbidden_names.py --diff "$BASE"
      - name: Forbidden names (PR title)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | python scripts/unreal/check_forbidden_names.py --stdin
      - name: Forbidden folder names and engine content
        run: python scripts/unreal/check_forbidden_names.py --folders
      - name: Bot isolation (F1) and perception symmetry (F6)
        run: python scripts/unreal/check_bot_isolation.py
      - name: LFS pointers, remote objects, size gate
        env:
          BASE: ${{ steps.base.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/unreal/check_lfs.py --diff "$BASE"
      - name: clang-format (changed lines)
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if ! command -v git-clang-format >/dev/null; then echo "::warning::git-clang-format missing"; exit 0; fi
          out="$(git clang-format --style=file:unreal/Verse/Harness/clang-format.yml --diff "$BASE" -- 'unreal/Verse/Source/*.h' 'unreal/Verse/Source/*.cpp' || true)"
          case "$out" in
            ""|*"no modified files to format"*|*"clang-format did not modify any files"*) echo "clang-format: clean" ;;
            *) printf '%s\n' "$out"; echo "::error::run git clang-format with unreal/Verse/Harness/clang-format.yml"; exit 1 ;;
          esac
      - name: Licence ledger and art text checks
        run: |
          if [ -f scripts/unreal/check_art_text.py ]; then python scripts/unreal/check_art_text.py; else echo "art text checks land with G0.7"; fi
      - name: Workflow policy (permissions, SHA pins, gate needs)
        run: python scripts/ci/check_workflow_policy.py
      - name: Harness script tests and fork safety (A10.2)
        run: python -m pytest -q -p no:cacheprovider --noconftest tests/unit/unreal_scripts

  wp19-loudness:
    # A19.4 evidence (work-packages.md WP19): build the Verse sounds from the CC0 ledger and
    # the recipes, render the 90 s reference duel offline exactly as the runtime plays it, gate
    # its loudness and keep the capture WAV and report as an artifact (never committed).
    name: wp19-loudness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the audio build dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scipy soundfile
      - name: Build the sounds
        run: python art/verse/audio/build_audio.py
      - name: Reference duel loudness gate (A19.4)
        run: python art/verse/audio/reference_mix.py --check
      - name: Upload the capture and the loudness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp19-loudness
          path: unreal/Verse/Saved/Harness/proof/WP19/19.1/
          if-no-files-found: warn
          retention-days: 30
