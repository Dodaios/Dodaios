# Rebuild the committed frontend bundle on main after a frontend merge.
#
# The repo ships dodaios/ui/web/dist so a fresh clone or install has a UI
# without Node. Until 2026-10-26 every frontend pull request carried its own
# build, so the moment one of them merged all the others conflicted with main
# and the merge queue ejected them (one PR took six rounds, about 6 h).
#
# Now pull requests leave dist/ alone (the merge train and agent_land.py put
# main's copy back, see pin_bundle in scripts/ci/agent_integrate.py), and this
# workflow builds dist/ from main's sources after the merge. It pushes the
# build to ONE bot branch, opens or updates its pull request and requests
# auto-merge, so the rebuild goes through CI and the merge queue like any
# other change. A newer frontend merge replaces an older rebuild that has not
# landed yet instead of stacking on it.
#
# Two jobs, two trust levels: `build` runs npm with no secrets; `publish`
# never runs npm or any repository code, it only commits the built files and
# talks to GitHub with the merge bot's token (the "PersonalJarvis Merge Bot"
# app that merge-train.yml names). Its key lives in the `merge-train`
# environment, which only main may use. The release bot's key stays reserved
# for release-cut.yml (check_workflow_policy.py).
#
# Action SHAs are pinned to the commits ci.yml already vetted.

name: Frontend bundle

on:
  push:
    branches: [main]
    paths:
      - "dodaios/ui/web/frontend/**"
      - ".github/workflows/frontend-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest main matters: a newer run supersedes an older one.
  group: frontend-bundle
  cancel-in-progress: true

env:
  DIST: dodaios/ui/web/dist
  BRANCH: bot/frontend-bundle

jobs:
  build:
    name: build the bundle from main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dodaios/ui/web/frontend/package-lock.json
      - name: Build
        working-directory: dodaios/ui/web/frontend
        # `npm run build` empties dist/ first, so it holds exactly this build.
        run: |
          npm ci
          npm run build
      - name: Startup bundle budget
        run: python3 scripts/ci/check_frontend_bundle_budget.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-bundle
          path: ${{ env.DIST }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  publish:
    name: open the rebuild pull request
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: merge-train
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Put the new build in place
        run: |
          set -euo pipefail
          rm -rf "$DIST"
          mkdir -p "$DIST"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-bundle
          path: ${{ env.DIST }}
      - name: Stage it
        id: stage
        run: |
          set -euo pipefail
          git add -A -- "$DIST"
          if git diff --cached --quiet; then
            echo "frontend-bundle: main's bundle is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The artifact came from a job that ran npm: never let it reach
          # anything outside dist/.
          outside="$(git diff --cached --name-only | grep -v "^$DIST/" || true)"
          if [ -n "$outside" ]; then
            echo "::error::frontend-bundle: the build touched files outside $DIST:"
            echo "$outside"
            exit 1
          fi
          # Every chunk index.html reaches is tracked, nothing unreachable is
          # (the same prune the merge train ran after its rebuilds).
          python3 scripts/ci/check_dist_consistency.py --staged --prune
          python3 scripts/ci/check_dist_consistency.py --staged
          git diff --cached --stat | tail -1
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Mint a merge bot token
        id: bot
        if: steps.stage.outputs.changed == 'true' && vars.MERGE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push the branch and request auto-merge
        if: steps.stage.outputs.changed == 'true'
        env:
          # An App token, unlike GITHUB_TOKEN, starts CI on the pull request
          # and lets the merge queue run its group.
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::frontend-bundle: MERGE_APP_ID is not set (merge-train.yml names the app), so main's bundle was not rebuilt."
            exit 1
          fi
          git config user.name  "jarvis-merge-train[bot]"
          git config user.email "jarvis-merge-train[bot]@users.noreply.github.com"
          git commit -q -m "chore(dist): rebuild the frontend bundle from ${SOURCE:0:10}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # One branch, rebuilt from main each run: an older rebuild that never
          # landed is replaced, never stacked on.
          git push --force "$remote" "HEAD:refs/heads/$BRANCH"
          title="chore(dist): rebuild the frontend bundle from main"
          body="Built from ${SOURCE} by frontend-bundle.yml. Pull requests no longer carry the bundle; this one brings main's up to date with its sources."
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body"
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          # A push switches auto-merge off; ask again every time.
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
          echo "frontend-bundle: pull request #$pr, auto-merge requested."
