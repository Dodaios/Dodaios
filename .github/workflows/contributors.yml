# Keep the README's contributor avatar wall current.
#
# A "Thanks to everyone who has shipped something here" list that never updates
# is worse than none: the first person to land a pull request looks for their
# face, does not find it, and reads that as the project not caring. This job
# regenerates the block between the contributors markers once a week and
# commits it only when it actually changed.
#
# It does NOT run as a required check on pull requests. Making a stale wall
# fail CI would turn every new contributor's own arrival into a red X.
#
# Action SHAs are pinned to the same 40-char commits ci.yml already vetted
# (CVE-2025-30066 hardening).

name: Contributors

on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour so it does not queue behind the crowd.
    - cron: "17 4 * * 1"
  # The moment that actually matters: somebody's first pull request just landed
  # and they go looking for their face. Waiting up to a week for the Monday run
  # is exactly the disappointment this section exists to avoid.
  #
  # `pull_request_target` rather than `pull_request` on purpose. A pull request
  # from a fork - which is what every outside contribution is - gets a
  # read-only token under `pull_request`, so the job could regenerate the wall
  # but never push it. `pull_request_target` runs in the base repository's
  # context with a writable token. That is only safe because this job never
  # checks out or executes anything from the pull request: it checks out `main`
  # explicitly below and the script only reads the GitHub API.
  pull_request_target:
    types: [closed]
  workflow_dispatch:

# Read-only: the merge bot token pushes the bot branch and opens the PR.
permissions:
  contents: read

concurrency:
  # One constant group, NOT keyed on the ref: every run of this job pushes the
  # same bot branch, so a merge-triggered run and the Monday run overlapping
  # would race on it. Serialise instead, and never cancel - a
  # cancelled run silently drops somebody off the wall until the next one.
  group: contributors
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh the avatar wall
    # A closed-but-not-merged pull request adds nobody.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The merge bot's private key lives in this environment, which only main
    # may use. Every trigger here runs on main and runs no PR code.
    environment: merge-train
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          # The bot token never lands in .git/config: only the last step
          # receives it, so nothing else in this job runs beside it.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Regenerate the block
        env:
          # Lifts the contributors API rate limit; no extra scope needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/update_contributors.py

      - name: Mint a merge bot token
        id: bot
        if: vars.MERGE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a pull request when it changed
        env:
          # main only takes changes through its merge queue, so nothing may
          # push there. The merge bot pushes a bot/ branch and opens a pull
          # request; the merge train (merge-train.yml) queues it once CI is
          # green. An App token, unlike GITHUB_TOKEN, starts that CI run.
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: bot/contributor-wall
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "contributors: nothing changed, no pull request."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::contributors: MERGE_APP_ID is not set (merge-train.yml names the app), so the wall was not refreshed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs(readme): refresh the contributor avatar wall"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # One bot branch, rebuilt from main each run: an older refresh that
          # never landed is replaced by this one, never stacked on top of it.
          git push --force "$remote" "HEAD:refs/heads/$BRANCH"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "contributors: updated pull request #$open."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "docs(readme): refresh the contributor avatar wall" \
            --body "Regenerated by contributors.yml. The merge train queues it once CI is green."
