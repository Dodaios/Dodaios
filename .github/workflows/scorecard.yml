# OpenSSF Scorecard: a weekly, public security score for this repository.
#
# The result lands in the Security tab and on https://scorecard.dev, and feeds
# the README badge. `publish_results: true` makes the scorecard API verify this
# workflow, so the job may only use the approved actions below and must not
# grow extra steps, a top-level `env` or `defaults`.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1" # Mondays, off the hour
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
