# unreal-gauntlet: headless bot-vs-bot balance runs and their gates (contracts/bot.md 11;
# architecture.md 8.3; work-packages.md WP10.5). The merge queue runs the short subset of
# bot.md 11.4 (BG1, BG2, BG4 for spray, camper, rusher, wallspam, BG11), nightly runs all.
# No pull_request trigger: fork code never reaches the self-hosted runner.
name: unreal-gauntlet

on:
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "queue or nightly"
        default: queue
        type: choice
        options: [queue, nightly]

permissions:
  contents: read

# One concurrency group per ref (a shared group keeps only one pending run and cancels the
# rest); scripts/unreal/with_lock.py serialises the Unreal work on the machine.
concurrency:
  group: unreal-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: unreal-gauntlet (path filter)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unreal: ${{ steps.diff.outputs.unreal }}
    steps:
      - id: diff
        name: Unreal paths in this change
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          # Only merge-queue entries are filtered here; the other triggers carry their own
          # path filter or run on a schedule. Any doubt (API error, 300+ files) means run.
          if [ "$EVENT" != "merge_group" ]; then
            echo "unreal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename'); then
            echo "unreal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(printf '%s\n' "$files" | grep -c . || true)
          pattern='^(unreal/|art/verse/|docs/verse/unreal/|scripts/unreal/|\.github/workflows/unreal-)'
          if [ "$count" -ge 300 ] || printf '%s\n' "$files" | grep -qE "$pattern"; then
            echo "unreal=true" >> "$GITHUB_OUTPUT"
          else
            echo "unreal=false" >> "$GITHUB_OUTPUT"
            echo "no Unreal path in this queue entry; the lane is skipped"
          fi

  gauntlet:
    name: unreal-gauntlet
    needs: changes
    if: needs.changes.outputs.unreal == 'true'
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      MODE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.mode || 'queue' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false
      - name: Build Win64 Development Editor
        run: python scripts/unreal/build.py editor
      # F2, F3 and BR1 come from automation tests (bot.md 10). Until WP07/WP08 add them the
      # filter matches nothing and this step fails; BG11 then reports not_run, never pass.
      - name: Fairness automation tests (F2, F3, BR1)
        continue-on-error: true
        run: python scripts/unreal/test.py "Verse.Bot.Fairness+Verse.Combat.Perception+Verse.Bot.Brain.Replay" --jobs 3
      # Queue: 40 bouts per pairing (balance.QUEUE_BOUTS). The bout table records the 95 %
      # interval this gives (queueHalfWidth: about +-0.15 bout share, +-0.03 kill share at
      # 22 kills per bout); the queue gates are one-sided and catch large regressions only.
      - name: Balance run and gates
        run: |
          $checks = 'unreal/Verse/Saved/Automation'
          if ($env:MODE -eq 'nightly') {
            python scripts/unreal/balance.py --set all --nightly --jobs 4 --seed $env:GITHUB_RUN_NUMBER `
              --checks-from-automation $checks
          } else {
            python scripts/unreal/balance.py --set ladder --set tricks --tricks spray,camper,rusher,wallspam `
              --gates BG1,BG2,BG4,BG11 --bouts 40 --jobs 4 --seed $env:GITHUB_RUN_NUMBER `
              --checks-from-automation $checks
          }
          exit $LASTEXITCODE
      - name: Nightly netcode with Iris on and off
        if: env.MODE == 'nightly'
        run: python scripts/unreal/netcode.py --iris both
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unreal-gauntlet-reports
          path: |
            unreal/Verse/Saved/Harness/balance/**/report.json
            unreal/Verse/Saved/Harness/balance/**/fire_audit.log
            unreal/Verse/Saved/Harness/netcode/
          if-no-files-found: warn
          retention-days: 30
