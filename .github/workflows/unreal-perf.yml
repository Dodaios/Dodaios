# unreal-perf: nightly GPU perf capture of the fixed replay against architecture.md 7, plus
# the reference-view screenshots and palette shares (art-pipeline.md 8.1, 14). Runs only in
# the quiet hours and skips when the person used the machine in the last 5 minutes
# (scripts/unreal/perf.py). No pull_request trigger.
name: unreal-perf

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-perf
  cancel-in-progress: false

jobs:
  perf:
    name: unreal-perf
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false
      - name: Build Win64 Development Editor
        run: python scripts/unreal/build.py editor
      - name: Perf replay, two runs (budgets and A10.5 stability)
        run: python scripts/unreal/perf.py run --profile 1440p --runs 2
      - name: Reference views and palette shares
        run: python scripts/unreal/capture.py shots --wp WP10 --subtask 10.7
      - name: Upload perf and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unreal-perf
          path: |
            unreal/Verse/Saved/Harness/perf/
            unreal/Verse/Saved/Harness/proof/WP10/
          if-no-files-found: warn
          retention-days: 30
