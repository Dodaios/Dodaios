# Tighten the count-ratchet baselines (scripts/ci/*-baseline.json).
#
# The ratchet gates fail only on NEW or GROWN violations; an improvement is just
# a note, so pull requests that delete code never fight over the baseline files.
# This job locks the gains in: once a day it re-baselines every gate with
# --update (which never raises a value) and opens ONE bot pull request when any
# baseline changed. The merge train (merge-train.yml) queues it once CI is green.
#
# Action SHAs are pinned to the same 40-char commits ci.yml already vetted.

name: Ratchet baselines

on:
  schedule:
    # Daily, 05:41 UTC. Off the hour so it does not queue behind the crowd.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratchet-baselines
  cancel-in-progress: false

jobs:
  tighten:
    name: tighten the ratchet baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The merge bot's private key lives in this environment, which only main
    # may use. This job runs on main and runs no PR code.
    environment: merge-train
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Re-baseline every ratchet
        run: |
          set -euo pipefail
          for gate in file_size function_size broad_except type_ignore source_text_tests frontend_escapes duplicates; do
            python "scripts/ci/check_${gate}.py" --update
          done

      - name: Mint a merge bot token
        id: bot
        if: vars.MERGE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a pull request when a baseline shrank
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: bot/ratchet-baselines
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/ci; then
            echo "ratchet-baselines: nothing shrank, no pull request."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ratchet-baselines: MERGE_APP_ID is not set, so the baselines were not tightened."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/ci
          git commit -m "chore(ci): tighten ratchet baselines"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # One bot branch, rebuilt from main each run.
          git push --force "$remote" "HEAD:refs/heads/$BRANCH"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "ratchet-baselines: updated pull request #$open."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(ci): tighten ratchet baselines" \
            --body "Regenerated by ratchet-baselines.yml: some ratchet counts shrank. The merge train queues it once CI is green."
