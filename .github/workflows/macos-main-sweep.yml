# macOS sweep of main: the whole Python suite on macOS, after the merge.
#
# A merge group proves on macOS only what its one runner does in about five
# minutes (ci.yml, `tests-macos-impact`); the whole suite there is 24 minutes
# on one runner. Without this workflow the rest waited for the nightly run: a
# macOS-only failure outside the selection showed up to a day and thirty to
# fifty merges later.
#
# Three shards, never part of `CI gate`: nothing waits for it. On one runner
# the sweep took 24 minutes, so a red result arrived after another five to ten
# merges; on three it is about eight. The runner-minutes are the same, the
# slots are held for a third of the time. `plan` restores the duration history
# once and hands every shard the same snapshot, so staggered shards never
# compute different partitions (the same rule as ci.yml).
#
# Runs share one concurrency group, so a sweep covers every commit merged
# while the one before it ran; GitHub keeps a single pending run and replaces
# it with the newest push. A red sweep opens the issue "macOS tests are red on
# main" with the range of commits since the last green one (nightly-alert.yml),
# and the next green sweep closes it.
name: macOS main sweep

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: macos-main-sweep
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  plan:
    name: duration snapshot
    # A branch asks ci.yml for macOS (`-f include_macos=true`); a sweep of
    # anything but main would only hold the slots main's sweep needs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      snapshot: ${{ steps.snapshot.outputs.name }}
    steps:
      - name: Restore duration history once
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: test-durations-
      - name: Ensure a duration snapshot exists
        id: snapshot
        run: |
          test -f test_durations.json || echo '{}' > test_durations.json
          echo "name=macos-sweep-durations-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Share the snapshot with every shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.snapshot.outputs.name }}
          path: test_durations.json
          if-no-files-found: error
          retention-days: 3

  suite:
    name: whole suite on macOS
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        uses: ./.github/actions/install-locked
        with:
          extras: dev telephony
      - name: Download the shared duration snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.snapshot }}
      - name: Run shard
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          python scripts/ci/run_tests_parallel.py tests --shard "$SHARD/3"
          --report "out/test-report-macos-sweep-$SHARD.json"
          --junit-out "out/junit-macos-sweep-$SHARD.xml"
          --deadline-minutes 30
      - name: Ratchet (a failure not in the baseline fails the sweep)
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-macos.json "out/test-report-macos-sweep-$SHARD.json"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-macos-sweep-${{ matrix.shard }}
          path: out/
          retention-days: 14
