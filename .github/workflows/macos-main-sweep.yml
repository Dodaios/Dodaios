# macOS sweep of main: the whole Python suite on macOS, after the merge.
#
# A merge group proves on macOS only what its one runner does in about five
# minutes (ci.yml, `tests-macos-impact`); the whole suite there is 24 minutes
# on three workers, and five macOS slots serve every group. Without this
# workflow the rest waited for the nightly run: a macOS-only failure outside
# the selection showed up to a day and thirty to fifty merges later.
#
# One job, one macOS slot, never part of `CI gate`: nothing waits for it. Runs
# share one concurrency group, so a sweep covers every commit merged while the
# one before it ran; GitHub keeps a single pending run and replaces it with
# the newest push. A red sweep opens the issue "macOS tests are red on main"
# with the range of commits since the last green one (nightly-alert.yml), and
# the next green sweep closes it.
name: macOS main sweep

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: macos-main-sweep
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  suite:
    name: whole suite on macOS
    # A branch asks ci.yml for macOS (`-f include_macos=true`); a sweep of
    # anything but main would only hold the slot main's sweep needs.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        uses: ./.github/actions/install-locked
        with:
          extras: dev telephony
      # One job runs every file, so nothing is partitioned by this history:
      # it only sizes the batches and their wall-clock budgets.
      - name: Restore duration history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: test-durations-
      - name: Run the whole suite
        continue-on-error: true
        run: >-
          python scripts/ci/run_tests_parallel.py tests
          --report out/test-report-macos-sweep.json
          --junit-out out/junit-macos-sweep.xml
      - name: Ratchet (a failure not in the baseline fails the sweep)
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-macos.json out/test-report-macos-sweep.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tests-macos-sweep
          path: out/
          retention-days: 14
