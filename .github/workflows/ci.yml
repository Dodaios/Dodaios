# CI orchestrator — the ONE pipeline every change goes through.
#
# Rebuilt 2026-09-28 after the Hermes Agent pipeline (NousResearch/hermes-agent),
# adapted to this repo. What changed and why — measured on the old file:
#
#   * The test suite ran as ONE pytest process for 75-95 min on a 4-core runner
#     and hit the job timeout on most runs; one wedged test ate the budget.
#     -> scripts/ci/run_tests_parallel.py: sharded matrix, batches of files in
#        fresh processes, per-process wall clock, isolate-and-retry on failure.
#   * Its exit code was ignored (`|| echo`), so any regression rode through
#     green as long as ~1 200 tests passed.
#     -> scripts/ci/ratchet_tests.py: known failures are baselined per OS in
#        scripts/ci/test-baseline-<os>.json; a NEW failure blocks.
#   * Every PR ran every job (~20 runners, three 45-min macOS jobs on most),
#     and pushes to main cancelled each other, so main was never proven.
#     -> `detect` classifies the diff into lanes (scripts/ci/classify_changes.py,
#        fail-open); only affected lanes run. Every merge-queue group and every
#        push to main runs the whole test suite and is never cancelled; the
#        nightly run and manual dispatches run every lane.
#   * Branch protection listed five job names; renaming a job meant a settings
#     change. -> `CI gate` aggregates every job (scripts/ci/required_results.py)
#     and is the ONLY required check, for humans and for the merge train.
#   * ~25 stdlib gates were separate steps in five jobs. -> scripts/ci/run_gates.py
#     runs them in one job, all of them report, and agents run the same command
#     locally.
#
# Merge queue: main requires a merge queue. A pull request's own run is the
# admission ticket; the `merge_group` run tests the exact tree main will get
# (the PR on top of main plus every entry ahead of it) with the whole Linux +
# Windows suite, and only a green `CI gate` there lands it. This is what keeps
# main green when PRs that pass alone break together.
#
# Tiers (scripts/ci/plan_run.py): the width of a run follows what it has to
# prove. Measured 2026-10-07..12 over 338 runs: a run fanned out to 46 jobs in
# the median (up to 69, 7-11 of them macOS) against 60 concurrent jobs with 5
# macOS slots, so two runs filled the pool; 56 % of macOS jobs waited more than
# five minutes (worst case two hours), and every change ran the suite three
# times - pull request, merge queue, and again on the push that landed the
# very same commit.
#   pr     pull request: the whole Linux + Windows suite and every affected
#          lane on Linux and Windows. No macOS.
#   queue  merge-queue group: everything `pr` runs plus one SHORT macOS leg
#          per affected lane. The blocking macOS proof per change; several
#          groups share the five macOS slots, and no leg takes much longer
#          than the test shards.
#   full   nightly, release tags, manual full dispatch: Intel macOS, the ARM
#          runners, every interpreter, the macOS test shards, and the long
#          real-product legs (the Hermes install on Windows, the real
#          runtimes and the real browser on macOS). A red nightly opens an
#          issue (nightly-alert.yml).
# A push to main whose commit the merge queue already passed runs nothing
# but `detect` and the gate (`proven`); a push that bypassed the queue runs
# the `queue` tier. A branch gets macOS feedback before the queue with
# `gh workflow run ci.yml --ref <branch> -f full=false -f include_macos=true`.
#
# Action SHAs are pinned to 40-char commits (CVE-2025-30066 hardening).

name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *" # nightly strict full run, macOS included
  workflow_dispatch:
    inputs:
      full:
        description: "Run every lane (off = only the lanes this branch's diff against main can affect; the merge train uses off)."
        type: boolean
        default: true
      include_macos:
        description: "Also run the macOS test shards and macOS desktop lane (~10x runner cost)."
        type: boolean
        default: true
      run_contract_soak:
        description: "Run the extended synthetic realtime orchestration soak (not release evidence)."
        type: boolean
        default: false

# A pull request (or a train-dispatched branch run) collapses to its newest
# commit. A run on main is never cancelled once it runs, but pushes to main
# share one group: GitHub keeps a single PENDING run and drops older pending
# ones, so a burst of agent pushes cannot stack a backlog behind the
# organisation's concurrent-job limit — the newest run covers every commit
# before it. Every merge-queue entry gets its own group and is never
# cancelled: the queue itself drops entries it no longer needs, and a dropped
# pending run would leave `CI gate` unreported until the queue times out. A
# macOS-free dispatch on main (the merge train's stand-in for a push its
# GITHUB_TOKEN merge never fired) shares the push group. The nightly run and
# other manual dispatches (release cuts included) get their own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref)) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && format('branch-{0}', github.ref)) || ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.include_macos)) && 'main-push') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Matrix jobs carry no explicit `name:`: a skipped matrix job renders an
  # interpolated name raw ("tests macos ${{ matrix.shard }}") in the check
  # list. The job id plus the matrix value reads cleanly in both states.
  detect:
    name: detect lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the merge-queue run lookup behind `proven`
    outputs:
      full: ${{ steps.lanes.outputs.full }}
      python: ${{ steps.lanes.outputs.python }}
      frontend: ${{ steps.lanes.outputs.frontend }}
      deps: ${{ steps.lanes.outputs.deps }}
      realtime: ${{ steps.lanes.outputs.realtime }}
      cli: ${{ steps.lanes.outputs.cli }}
      dragdrop: ${{ steps.lanes.outputs.dragdrop }}
      browser: ${{ steps.lanes.outputs.browser }}
      macos_desktop: ${{ steps.lanes.outputs.macos_desktop }}
      installer: ${{ steps.lanes.outputs.installer }}
      updater: ${{ steps.lanes.outputs.updater }}
      agent_runtimes: ${{ steps.lanes.outputs.agent_runtimes }}
      macos: ${{ steps.mode.outputs.macos }}
      base: ${{ steps.mode.outputs.base }}
      pr_mode: ${{ steps.mode.outputs.pr_mode }}
      proven: ${{ steps.proven.outputs.proven }}
      linux_shards: ${{ steps.mode.outputs.linux_shards }}
      windows_shards: ${{ steps.mode.outputs.windows_shards }}
      os_matrix: ${{ steps.mode.outputs.os_matrix }}
      lane_os: ${{ steps.mode.outputs.lane_os }}
      updater_matrix: ${{ steps.mode.outputs.updater_matrix }}
      crypto_matrix: ${{ steps.mode.outputs.crypto_matrix }}
      e2e_matrix: ${{ steps.mode.outputs.e2e_matrix }}
      browser_os: ${{ steps.mode.outputs.browser_os }}
      desktop_legs: ${{ steps.mode.outputs.desktop_legs }}
      duration_snapshot: ${{ steps.snapshot.outputs.name }}
      release: ${{ github.ref_type == 'tag' }}
    steps:
      # History without file contents: the diff base needs commits and
      # trees only, and every other job waits for this one.
      - name: Checkout (full history for the diff base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide the tier, the matrices and the diff base
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_FULL: ${{ inputs.full }}
          IN_MACOS: ${{ inputs.include_macos }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The tier and every job matrix (scripts/ci/plan_run.py). A
          # merge-queue group and a push to main classify their lanes like a
          # pull request; a merge group's lanes are classified against the
          # queue base (main or the entry ahead). Nightly and manual full
          # runs force everything.
          python3 scripts/ci/plan_run.py plan --event "$EVENT" --ref "$GITHUB_REF" \
            --full "${IN_FULL:-false}" --include-macos "${IN_MACOS:-false}"
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main || true
          base="$PR_BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
          fi
          if [ "$EVENT" = "push" ]; then
            case "$BEFORE" in (*[!0]*) git cat-file -e "$BEFORE^{commit}" 2>/dev/null && base="$BEFORE" ;; esac
          fi
          echo "base=$base" | tee -a "$GITHUB_OUTPUT"

      # A queue group and the push that lands it are ONE commit. When the
      # queue already passed it, this run has nothing left to prove: every
      # lane goes off and the gate needs `detect` alone. Any doubt (a direct
      # push, an API error) fails open to the `queue` tier.
      - name: Did the merge queue already pass this exact commit?
        id: proven
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ steps.mode.outputs.full_mode }}
          MACOS: ${{ steps.mode.outputs.macos }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$FULL" != "true" ] && [ "$MACOS" != "true" ] \
            && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            python3 scripts/ci/plan_run.py proven --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
          else
            echo "proven=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Classify the change into lanes
        id: lanes
        shell: bash
        env:
          FULL: ${{ steps.mode.outputs.full_mode }}
          BASE: ${{ steps.mode.outputs.base }}
          PROVEN: ${{ steps.proven.outputs.proven }}
        run: |
          if [ "$PROVEN" = "true" ]; then
            python3 scripts/ci/classify_changes.py --proven
          elif [ "$FULL" = "true" ] || [ -z "$BASE" ]; then
            python3 scripts/ci/classify_changes.py --full
          else
            # --no-renames: both sides of a rename count as changed, and the
            # blobless checkout never has to fetch file contents to pair them.
            git diff --name-only --no-renames "$BASE" HEAD | tee changed.txt | python3 scripts/ci/classify_changes.py
          fi

      # Resolve the mutable cache ONCE. All shards download the same immutable
      # snapshot; staggered runners must never compute different partitions.
      - name: Restore duration history once
        if: steps.lanes.outputs.python == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: test-durations-
      # Windows runs the same files at other speeds: sharded by the Linux
      # history, one Windows shard took 12 minutes while the others took 7 to
      # 8, and the gate waits for the slowest. It has a history of its own,
      # in a cache of its own so the Linux one keeps its key and version.
      - name: Restore the Windows duration history once
        if: steps.lanes.outputs.python == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations_windows.json
          key: test-durations-windows-never-exact
          restore-keys: test-durations-windows-
      - name: Ensure a duration snapshot exists
        id: snapshot
        if: steps.lanes.outputs.python == 'true'
        run: |
          test -f test_durations.json || echo '{}' > test_durations.json
          # Until Windows has a history it shards by the Linux one, as before.
          test -s test_durations_windows.json || cp test_durations.json test_durations_windows.json
          echo "name=test-duration-snapshot-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Share duration snapshot with every shard
        if: steps.lanes.outputs.python == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ steps.snapshot.outputs.name }}
          path: |
            test_durations.json
            test_durations_windows.json
          if-no-files-found: error
          retention-days: 7

  gates:
    name: static gates
    needs: detect
    if: needs.detect.outputs.proven != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for diff-scoped gates)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Light on purpose (no torch, no audio), yet every version comes from
      # uv.lock: an upstream release cannot turn the gates red on its own.
      - name: Install the light gate dependencies from uv.lock
        uses: ./.github/actions/install-locked
        with:
          tools-only: "true"
          with: typer platformdirs click httpx rich pyyaml pydantic loguru python-dotenv packaging
      - name: Run every static gate
        env:
          PRIVACY_PRIVATE_EMAILS: ${{ vars.PRIVACY_PRIVATE_EMAILS }}
          BASE: ${{ needs.detect.outputs.base }}
          PR_MODE: ${{ needs.detect.outputs.pr_mode }}
        run: |
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main || true
          args=()
          [ -n "$BASE" ] && args+=(--base "$BASE")
          [ "$PR_MODE" = "true" ] && args+=(--pr)
          python scripts/ci/run_gates.py "${args[@]}"
      - name: Validate workflow syntax, expressions and action inputs
        if: always()
        env:
          GOTOOLCHAIN: go1.27.1
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=

  # Workflow audit. A blocking part of the gate on every event, merge-queue
  # groups included (only a push the queue already proved skips it);
  # security.yml keeps uploading the same audit to the Security tab from main.
  # Accepted exceptions live in .github/zizmor.yml.
  zizmor:
    name: zizmor (workflow audit)
    needs: detect
    if: needs.detect.outputs.proven != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          min-severity: medium
          advanced-security: false
          annotations: true
          # Explicit: auto-discovery did not apply every ignore in a local
          # `zizmor .` run, and a blocking audit must read the same rules.
          config: .github/zizmor.yml

  # Fails when the diff ADDS a dependency with a known high or critical
  # advisory. Only a pull request has a dependency diff; on every other
  # event (merge queue, main, nightly) it skips and the gate accepts that.
  dependency-review:
    name: dependency review
    needs: detect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Third-party websites the app parses (ollama.com's model library) change
  # without notice. Those live checks are opt-in (JARVIS_LIVE_NETWORK_TESTS)
  # and run only in the nightly: a redesign shows up as a failed step and a
  # warning there, never as a red pull request, merge queue or nightly gate.
  live-network:
    name: live third-party sites (nightly, non-blocking)
    needs: detect
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        uses: ./.github/actions/install-locked
        with:
          extras: dev
      - name: Live ollama.com library checks
        id: live
        continue-on-error: true
        env:
          JARVIS_LIVE_NETWORK_TESTS: "1"
        run: python -m pytest -m integration tests/integration/test_ollama_library_live.py -v
      - name: Report a drifted site without failing the run
        if: steps.live.outcome == 'failure'
        run: echo "::warning title=Live site check failed::A third-party page the app parses changed (see the 'Live ollama.com library checks' step). Update its parser."

  release-qualification:
    name: release qualification
    needs: [detect, gates]
    if: github.ref_type == 'tag' && needs.detect.outputs.full == 'true' && needs.detect.outputs.macos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the light qualification dependencies from uv.lock
        uses: ./.github/actions/install-locked
        with:
          tools-only: "true"
          with: pyyaml pydantic loguru python-dotenv packaging rich typer platformdirs click httpx
      - name: Qualify plugin auth and disclose preview plugins
        shell: bash
        run: |
          # A plugin ships as "verified" only with a completed browser journey;
          # every other one ships labeled "preview" in the app (AGENTS.md section 3).
          report="$(python scripts/ci/check_plugin_auth_contract.py --require-e2e-pass)"
          printf '%s\n' "$report"
          # The last line counts verified and preview plugins for the release.
          printf '%s\n' "${report##*$'\n'}" >> "$GITHUB_STEP_SUMMARY"

  python-fast:
    name: python contracts (fast)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install base + dev from uv.lock (no platform extras - the VPS/base install)
        uses: ./.github/actions/install-locked
        with:
          extras: dev
      - name: Import-cleanliness gate (the bare install imports clean)
        run: python scripts/ci/check_import_clean.py
      - name: Test-only system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
          python scripts/ci/install_locked.py --extra telephony
      # Blocking and outside the ratchet on purpose: these pin contracts that
      # are cheap to break and expensive to notice (ADR-0011 router, AP-11
      # scrubber, AP-4 enum parity, the one turn-language resolver, skill
      # routing precision AND recall, the browser-auth standard).
      - name: Contract guards
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/unit/brain/test_routing.py \
            tests/unit/brain/test_output_filter.py \
            tests/unit/sessions/test_hangup_reason_parity.py \
            tests/unit/core/test_turn_language.py \
            tests/unit/skills/test_skill_routing_offline.py \
            tests/contract/test_plugin_auth_standard.py \
            tests/contract/test_connector_auth.py \
            tests/contract/test_service_connectors.py \
            tests/contract/test_plugin_availability.py \
            tests/contract/test_home_assistant_browser_auth.py
          python scripts/skill_relevance_calibrate.py
      - name: ruff lint (report-only backlog)
        continue-on-error: true
        run: python -m ruff check jarvis/
      - name: ruff format (report-only backlog)
        continue-on-error: true
        run: python -m ruff format --check jarvis/
      - name: mypy (report-only backlog)
        continue-on-error: true
        run: python -m mypy jarvis/

  tests-linux:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect.outputs.linux_shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 libegl1 libopengl0
      - name: Install
        uses: ./.github/actions/install-locked
        with:
          extras: dev telephony
      - name: Download the shared duration snapshot
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.detect.outputs.duration_snapshot }}
      - name: Run shard
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.detect.outputs.linux_shards }}
        run: |
          total=$(python -c "import json,os; print(len(json.loads(os.environ['SHARDS'])))")
          python scripts/ci/run_tests_parallel.py tests \
            --shard "$SHARD/$total" \
            --report "out/test-report-linux-$SHARD.json" \
            --junit-out "out/junit-linux-$SHARD.xml" \
            --durations-out "out/durations-linux-$SHARD.json"
      - name: Ratchet (a failure not in the baseline blocks)
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-linux.json "out/test-report-linux-$SHARD.json"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tests-linux-${{ matrix.shard }}
          path: out/
          retention-days: 14

  tests-windows:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect.outputs.windows_shards) }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # The whole suite on every tier: a Windows-only failure blocks the pull
      # request instead of ejecting it from the merge queue.
      # scripts/ci/select_tests.py stays for agent_land.py's local run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        uses: ./.github/actions/install-locked
        with:
          extras: dev telephony
      - name: Download the shared duration snapshot
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.detect.outputs.duration_snapshot }}
      - name: Run shard
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.detect.outputs.windows_shards }}
        run: |
          total=$(python -c "import json,os; print(len(json.loads(os.environ['SHARDS'])))")
          python scripts/ci/run_tests_parallel.py tests \
            --shard "$SHARD/$total" \
            --durations test_durations_windows.json \
            --report "out/test-report-windows-$SHARD.json" \
            --junit-out "out/junit-windows-$SHARD.xml" \
            --durations-out "out/durations-windows-$SHARD.json"
      - name: Ratchet (a failure not in the baseline blocks)
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-windows.json "out/test-report-windows-$SHARD.json"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tests-windows-${{ matrix.shard }}
          path: out/
          retention-days: 14

  tests-macos:
    needs: detect
    if: needs.detect.outputs.macos == 'true' && needs.detect.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        uses: ./.github/actions/install-locked
        with:
          extras: dev telephony
      - name: Download the shared duration snapshot
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.detect.outputs.duration_snapshot }}
      - name: Run shard
        continue-on-error: true
        run: >-
          python scripts/ci/run_tests_parallel.py tests --shard ${{ matrix.shard }}/3
          --report out/test-report-macos-${{ matrix.shard }}.json
          --junit-out out/junit-macos-${{ matrix.shard }}.xml
      - name: Ratchet (a failure not in the baseline blocks)
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-macos.json out/test-report-macos-${{ matrix.shard }}.json
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tests-macos-${{ matrix.shard }}
          path: out/
          retention-days: 14

  test-report:
    name: test report + floor
    needs: [detect, tests-linux]
    # Preserve failure reporting without keeping superseded PR runs alive.
    if: ${{ !cancelled() && needs.detect.outputs.python == 'true' && needs.tests-linux.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Download shard reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: tests-linux-*
          path: reports
          merge-multiple: true
      - name: Min-passed floor across all Linux shards (BLOCKING)
        env:
          SHARDS: ${{ needs.detect.outputs.linux_shards }}
        run: |
          total=$(python -c "import json,os; print(len(json.loads(os.environ['SHARDS'])))")
          python scripts/ci/ratchet_tests.py summary --floor --expected-shards "$total" --baseline scripts/ci/test-baseline-linux.json reports
      # Report only: flaky files (failed in a batch, passed alone) and new vs
      # known failures. On main the cross-OS view and the "Flaky tests on main"
      # issue come from .github/workflows/flaky-tests.yml.
      - name: Flaky files and failures (report only)
        if: ${{ !cancelled() }}
        run: python scripts/ci/flaky_report.py summary reports

  # Shard timings for the next runs, one history per OS. Only a run on main
  # may write a cache every branch can read: the nightly run, a manual run on
  # main and a push that bypassed the queue (a push the merge queue already
  # proved runs no tests). Only complete, green shards feed it: a history
  # with holes would unbalance every run after it.
  duration-cache:
    name: duration cache (main only)
    needs: [detect, tests-linux, tests-windows]
    if: needs.detect.outputs.python == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Download the Linux shard reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: tests-linux-*
          path: reports/linux
          merge-multiple: true
      - name: Download the Windows shard reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: tests-windows-*
          path: reports/windows
          merge-multiple: true
      - name: Merge the shard timings
        run: |
          python scripts/ci/ratchet_tests.py durations --out test_durations.json reports/linux
          python scripts/ci/ratchet_tests.py durations --out test_durations_windows.json reports/windows
      - name: Save the Linux duration cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-${{ github.run_id }}
      - name: Save the Windows duration cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations_windows.json
          key: test-durations-windows-${{ github.run_id }}

  # Three test shards and the build side by side: `npm test` alone took seven
  # minutes in one process and was the longest Linux leg of a run.
  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: ["test 1/3", "test 2/3", "test 3/3", "build + budget"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jarvis/ui/web/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jarvis/ui/web/frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (one shard)
        if: startsWith(matrix.part, 'test ')
        env:
          PART: ${{ matrix.part }}
        run: npm test -- --shard="${PART#test }"
      - name: Production build
        if: matrix.part == 'build + budget'
        run: npm run build
      # The entry chunk's size IS startup latency (AP-26's measurable half).
      - name: Startup bundle budget
        if: matrix.part == 'build + budget'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/check_frontend_bundle_budget.py

  jarvisctl:
    needs: detect
    if: needs.detect.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.os_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # --no-deps proves jarvis.cli_ctl imports and renders --help with only its
      # own light runtime deps: no torch, audio or GUI stack.
      - name: Light install from uv.lock
        uses: ./.github/actions/install-locked
        with:
          tools-only: "true"
          with: typer platformdirs click httpx rich pytest pytest-asyncio pyyaml pydantic loguru python-dotenv packaging
      - name: Import/--help smoke
        shell: bash
        run: |
          python -c "import jarvis.cli_ctl.__main__"
          python -m jarvis.cli_ctl --help
      - name: Base install from uv.lock
        uses: ./.github/actions/install-locked
        with:
          with: pytest pytest-asyncio hypothesis
      - name: jarvisctl unit suite
        run: python -m pytest tests/unit/cli_ctl/ -q -p no:cacheprovider

  deps:
    name: deps-sync + portable install matrix
    needs: detect
    if: needs.detect.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install packaging==25.0 uv==0.11.19
      - name: requirements.in mirrors pyproject (AP-23)
        run: python scripts/ci/check_requirements_sync.py
      - name: Lockfile universal + GPU-free
        run: python scripts/ci/check_lockfile_universal.py
      - name: Target-resolved portable install matrix
        run: python scripts/ci/check_portable_install_matrix.py --jobs 4

  native-crypto-runtime:
    name: native crypto (${{ matrix.runner }}, Python ${{ matrix.python }})
    needs: detect
    if: needs.detect.outputs.deps == 'true'
    strategy:
      fail-fast: false
      # Windows ARM on a pull request, Intel macOS added in the queue, both
      # interpreters and Apple Silicon in the wide matrix (plan_run.py).
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.crypto_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Fresh hashed base install without crypto compilation
        run: python scripts/pip_install.py --require-hashes --only-binary=cryptography,asyncssh -r requirements.txt
      - name: Native security and compatibility contracts
        shell: bash
        run: |
          python -m pip install pytest pytest-asyncio pytest-timeout
          python -m pytest --confcutdir=tests/contract -q tests/contract/test_native_crypto.py tests/contract/test_native_ssh.py
      - name: Confirm the published native wheel uses the reviewed OpenSSL
        if: matrix.runner != 'macos-15'
        shell: python
        run: |
          import json
          from pathlib import Path
          from cryptography.hazmat.backends.openssl.backend import backend
          expected = json.loads(Path('packaging/native-crypto.json').read_text())['openssl']['version']
          actual = backend.openssl_version_text()
          print(actual)
          assert actual.startswith(f'OpenSSL {expected} '), (actual, expected)

  realtime-contract:
    needs: detect
    if: needs.detect.outputs.realtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.lane_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Portable base + focused runner from uv.lock
        uses: ./.github/actions/install-locked
        with:
          with: pytest pytest-asyncio
      - name: Provider-neutral realtime contract
        run: >-
          python -m pytest
          tests/contract/test_gpt_live.py
          tests/contract/test_live_profile_catalog.py
          tests/contract/test_subscription_access_boundary.py
          tests/contract/test_subscription_report_pipeline.py
          tests/contract/test_realtime_provider_contract.py
          tests/contract/test_realtime_reliability_gate.py
          tests/unit/live/test_subscription_auth.py
          tests/unit/live/test_subscription_reasoning.py
          tests/unit/live/test_subscription_session.py
          tests/unit/live/test_subscription_wire.py
          tests/unit/live/test_login_helper.py
          tests/unit/test_agent_login_flow.py
          tests/unit/clis/test_prober_cancellation.py
          tests/unit/ui/web/test_registry_bootstrap_shutdown.py
          -q -p no:cacheprovider

  # The in-app updater on every OS it ships to. Each one replaces a running
  # app differently (Inno handover, .app swap, AppImage swap, git transaction
  # + restart helper), and the POSIX-only tests run the real relaunch waiter.
  # A pull request runs Linux and the real Windows upgrade; the merge queue
  # adds macOS and the second Windows interpreter; the wide matrix adds the
  # Intel Mac (scripts/ci/plan_run.py).
  #
  # Python: 3.11 is the floor, 3.12 is what the native installers freeze.
  # macos-15-intel adds the x86_64 Mac (the Intel .dmg and its Rosetta probe).
  # The real-OS handover tests build a real .dmg on macOS and, in the 3.12
  # Windows job, compile the real Inno script and upgrade a RUNNING install
  # with it (JARVIS_INSTALLER_E2E) — the only proof the installer actually
  # waits for the old app and brings the new one back.
  updater:
    name: updater (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: detect
    if: needs.detect.outputs.updater == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.updater_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Portable base + focused runner from uv.lock
        uses: ./.github/actions/install-locked
        with:
          with: pytest pytest-asyncio
      - name: Inno Setup for the real installer upgrade
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            Write-Host "Inno Setup already present: $found"
          } else {
            choco install innosetup --no-progress -y
          }
          "JARVIS_INSTALLER_E2E=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Updater suite (status, verify, handover, restart, rollback)
        shell: bash
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          python -m pytest -q -p no:cacheprovider -rs \
            tests/unit/core/test_installer_update.py \
            tests/unit/core/test_installer_update_http.py \
            tests/unit/install/test_installer_update_contract.py \
            tests/unit/ui/test_relauncher.py \
            tests/unit/ui/test_relauncher_frozen.py \
            tests/unit/ui/test_relauncher_fresh_env.py \
            tests/unit/ui/test_relauncher_update_transaction.py \
            tests/unit/ui/web/test_launcher_update_handoff.py \
            tests/unit/ui/web/test_update_routes.py \
            tests/unit/ui/web/test_update_routes_frozen.py \
            tests/unit/web/test_update_progress.py \
            tests/unit/web/test_update_progress_route.py \
            tests/unit/web/test_update_subprocess_stream.py \
            tests/integration/test_update_apply_real_git.py \
            tests/integration/test_update_handover_real_os.py

  realtime-slim:
    name: realtime on python:3.11-slim (no PortAudio)
    needs: detect
    if: needs.detect.outputs.realtime == 'true'
    runs-on: ubuntu-latest
    container: python:3.11-slim
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Base install without system audio, from uv.lock
        uses: ./.github/actions/install-locked
        with:
          with: pytest pytest-asyncio
      - name: The container really has no usable PortAudio
        run: |
          python - <<'PY'
          try:
              import sounddevice  # noqa: F401
          except Exception as exc:
              print(f"NO_PORTAUDIO: {type(exc).__name__}: {exc}")
          else:
              raise SystemExit("python:3.11-slim unexpectedly loaded PortAudio")
          PY
      - name: Headless realtime degradation contract
        run: >-
          python -m pytest
          tests/contract/test_gpt_live.py
          tests/contract/test_live_profile_catalog.py
          tests/contract/test_subscription_access_boundary.py
          tests/contract/test_subscription_report_pipeline.py
          tests/contract/test_realtime_provider_contract.py
          tests/contract/test_realtime_reliability_gate.py
          tests/unit/live/test_subscription_auth.py
          tests/unit/live/test_subscription_reasoning.py
          tests/unit/live/test_subscription_session.py
          tests/unit/live/test_subscription_wire.py
          tests/unit/live/test_login_helper.py
          tests/unit/test_agent_login_flow.py
          tests/unit/clis/test_prober_cancellation.py
          tests/unit/ui/web/test_registry_bootstrap_shutdown.py
          -q -p no:cacheprovider

  soak:
    name: realtime contract soak (not release evidence)
    needs: detect
    if: github.event_name == 'workflow_dispatch' && inputs.run_contract_soak
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Base install from uv.lock
        uses: ./.github/actions/install-locked
      - run: python scripts/realtime_reliability_gate.py --contract-soak

  dragdrop:
    needs: detect
    if: needs.detect.outputs.dragdrop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.os_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # ==0.4.2: later osx-arm64 builds are Tcl-9 and fail on Tcl-8.6 Python.
      - name: Install tkinterdnd2 (+ Linux X11 runtime)
        shell: bash
        run: |
          pip install "tkinterdnd2==0.4.2"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-tk xvfb libxcursor1 libxrender1 libxext6 libxft2 libxinerama1 libxi6 libxrandr2
          fi
      - name: Drag-drop executes
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/crossplatform/verify_drop_target.py
          else
            python scripts/crossplatform/verify_drop_target.py
          fi

  browser:
    name: browser runtime
    needs: detect
    if: needs.detect.outputs.browser == 'true'
    uses: ./.github/workflows/browser-runtime.yml
    with:
      os: ${{ needs.detect.outputs.browser_os }}

  macos-desktop:
    name: macOS desktop
    needs: detect
    if: needs.detect.outputs.macos_desktop == 'true' && needs.detect.outputs.desktop_legs != 'none'
    uses: ./.github/workflows/macos-desktop.yml
    with:
      legs: ${{ needs.detect.outputs.desktop_legs }}

  installer:
    name: installer smoke
    needs: detect
    if: needs.detect.outputs.installer == 'true'
    uses: ./.github/workflows/installer-smoke.yml
    with:
      force: ${{ needs.detect.outputs.full == 'true' }}
      include_macos: ${{ needs.detect.outputs.macos == 'true' }}

  # Hermes / OpenClaw society agents on every OS a person runs them on. The
  # lane (scripts/ci/agent_runtime_suite.py) covers the runtimes AND the chat
  # and society code that drives them. A pull request proves Linux and
  # Windows, the merge queue adds macOS before anything lands. Fakes only: no
  # key, no network to a model.
  agent-runtimes-unit:
    needs: detect
    if: needs.detect.outputs.agent_runtimes == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.lane_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Portable base + focused runner
        shell: bash
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
      - name: Runtimes, chat and society suite
        run: python scripts/ci/agent_runtime_suite.py

  # A downloader's headless Linux server: no GPU, audio or desktop stack.
  agent-runtimes-headless:
    name: agent runtimes on python:3.11-slim
    needs: detect
    if: needs.detect.outputs.agent_runtimes == 'true'
    runs-on: ubuntu-latest
    container: python:3.11-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Base install without system audio
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
      - name: The runtime package imports without any optional stack
        run: python -c "import jarvis.agent_runtimes.gateway, jarvis.agent_runtimes.manager, jarvis.agent_chat.runner_acp"
      - name: Runtime suite
        run: python scripts/ci/agent_runtime_suite.py --headless
      # The container has no curl: the app's own Hermes setup must stop with a
      # plain reason instead of "succeeding" on an empty download.
      - name: Setup without curl fails with a plain reason
        run: python scripts/ci/agent_runtime_e2e.py hermes --timeout 600 --expect-setup-failure "Setup needs curl"

  # The REAL runtimes, installed the way the desktop app installs them: the
  # app's own setup job (manager.wait_ready) at the pinned release from
  # jarvis/agent_runtimes/runtime-versions.json, with a desktop app's PATH,
  # never npm or a manual installer. Then two turns per model-gateway protocol
  # against scripted providers, the fake-model driver check with turn-1
  # budgets, the runtime unit tests on the same machine, and proof that the
  # user PATH and shell profiles stayed put (scripts/ci/agent_runtime_e2e.py).
  # No key, no network to a model. The weekly canary does the same at
  # upstream latest and raises the pin. Every change runs both runtimes on
  # Linux and OpenClaw on Windows; nightly and release runs add the Hermes
  # install on Windows (14-23 minutes) and both macOS legs
  # (scripts/ci/plan_run.py).
  agent-runtimes-e2e:
    needs: detect
    if: needs.detect.outputs.agent_runtimes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.e2e_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the base app
        run: |
          python scripts/pip_install.py -e "."
          python -m pip install pytest pytest-asyncio
      # Downloads only: the private OpenClaw copy and uv's cache. Never Hermes'
      # own home, so its install and prepare run for real on every pin.
      - name: Reuse the pinned runtime downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.jarvis/agent_runtimes/openclaw-cli
            ~/AppData/Local/Jarvis/agent_runtimes/openclaw-cli
            ~/.cache/uv
            ~/Library/Caches/uv
            ~/AppData/Local/uv/cache
          key: agent-runtimes-${{ matrix.runtime }}-${{ runner.os }}-${{ hashFiles('jarvis/agent_runtimes/runtime-versions.json') }}
      - name: Set up through the app, drive it, prove nothing else changed
        run: python scripts/ci/agent_runtime_e2e.py ${{ matrix.runtime }}
      - name: Keep the setup and runtime logs of a failed run
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: agent-runtimes-e2e-${{ matrix.runtime }}-${{ matrix.os }}
          path: eval-results/
          if-no-files-found: ignore
          retention-days: 7

  # The ONE required check. Branch protection and the merge train read only
  # this; a new job needs nothing but a line in `needs`.
  gate:
    name: CI gate
    needs:
      - detect
      - gates
      - zizmor
      - dependency-review
      - live-network
      - python-fast
      - release-qualification
      - tests-linux
      - tests-windows
      - tests-macos
      - test-report
      - duration-cache
      - frontend
      - jarvisctl
      - deps
      - native-crypto-runtime
      - realtime-contract
      - realtime-slim
      - soak
      - dragdrop
      - browser
      - macos-desktop
      - installer
      - updater
      - agent-runtimes-unit
      - agent-runtimes-headless
      - agent-runtimes-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Evaluate every job
        env:
          NEEDS: ${{ toJSON(needs) }}
          STRICT: ${{ github.event_name == 'schedule' }}
        run: |
          args=(--pipeline)
          [ "$STRICT" = "true" ] && args+=(--strict)
          printf '%s' "$NEEDS" | python3 scripts/ci/required_results.py "${args[@]}"
